<!DOCTYPE html>
<!-- 🚫 DO NOT EDIT THIS FILE — it is the page frame only. All words and images live in the content/ folder. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Horizon Productions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Chakra+Petch:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="warn" id="warn" hidden></div>

<!-- START-UP SCREEN -->
<div class="boot" id="boot" role="dialog" aria-modal="true" aria-labelledby="bt">
  <div class="door t"></div><div class="door b"></div>
  <div class="bootui">
    <div class="start" id="start">
      <p class="tag" data-text="boot label"></p>
      <h2 id="bt" data-text="boot heading"></h2>
      <p data-text="boot paragraph"></p>
      <div class="row"><button class="key go" id="bootSound" data-text="boot button sound"></button><button class="key" id="bootSilent" data-text="boot button silent"></button></div>
    </div>
    <div class="term" id="term" hidden>
      <div class="termbar"><span data-text="boot window title"></span><button class="key" id="skip" data-text="skip button"></button></div>
      <pre id="lines"></pre>
      <div class="prog"><i id="prog"></i></div>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- TOP BAR -->
  <header class="panel top">
    <span class="brand" data-text="company name"></span>
    <div class="leds">
      <span><i class="led"></i><span data-text="status light text"></span></span>
      <span><span id="clock">00:00:00</span> UTC</span>
      <button class="key" id="mute" aria-pressed="true"></button>
    </div>
  </header>

  <!-- HERO + CAMERA SCREEN -->
  <section class="panel hero">
    <div>
      <p class="tag" data-text="hero label"></p>
      <h1 data-text="hero headline"></h1>
      <p class="lede" data-text="hero paragraph"></p>
    </div>
    <div class="scope">
      <div class="bezel">
        <div class="crt">
          <canvas id="moon" width="160" height="160" role="img" aria-label="Live camera view from the spacecraft: the lunar surface, space, and a space station"></canvas>
          <div class="fx vig"></div>
          <div class="hud tl"><i class="rec"></i><span data-text="monitor top left"></span></div>
          <div class="hud tr" data-text="monitor top right"></div>
          <div class="hud bl">Alt <b id="alt">2000</b> m<br>Vel <b id="vel">1.67</b> km/s</div>
          <div class="hud br" id="pos">Lat 00.67 N<br>Lon 23.47 E</div>
        </div>
      </div>
      <div class="camkeys" role="group" aria-label="Camera selection">
        <button class="key" data-cam="1" aria-pressed="true" data-text="cam button 1"></button>
        <button class="key" data-cam="2" aria-pressed="false" data-text="cam button 2"></button>
        <button class="key" data-cam="3" aria-pressed="false" data-text="cam button 3"></button>
      </div>
      <div class="plate" data-text="monitor plate"></div>
    </div>
  </section>

  <!-- BUTTONS + SCREENS (built automatically from content/navigation.js) -->
  <div class="console">
    <aside class="panel side" id="nav" role="tablist" aria-label="Console screens"></aside>
    <main class="panel screen" id="screens"></main>
  </div>
  <p class="foot" data-text="footer text"></p>
</div>

<!-- Content files (words and images), then the engine -->
<script src="content/site-text.js"></script>
<script src="content/navigation.js"></script>
<script src="content/manifest.js"></script>
<script src="content/captains-log.js"></script>
<script src="content/comms.js"></script>
<script src="site.js"></script>
</body>
</html>
